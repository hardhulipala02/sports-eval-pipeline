name: Lone Star Showdown AI Agent CI/CD Benchmark

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  eval-sports-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Free Ollama Runner in GitHub Actions
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull llama3.2

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastmcp mcp langchain-ollama pydantic ragas datasets pytest

      - name: Execute RAGAS Auto-Evals
        run: |
          python evals/ragas_eval_pipeline.py